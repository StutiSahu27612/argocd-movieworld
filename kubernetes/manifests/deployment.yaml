apiVersion: apps/v1
kind: Deployment
metadata:
  name: movieworld
  namespace: movie
  labels:
    app: movieworld
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movieworld
      version: v1
  template:
    metadata:
      labels:
        app: movieworld
        version: v1
    spec:
      containers:
      - name: movieworld
        image: -docker.pkg.dev/project-stuti-477509/argocd-poc-repo/movieworld-app-image:da72a75b5793f4ff31b3c11c5ed043275db907a7
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SERVER_PORT
          value: "9090"
        - name: MOVIE_REVIEW_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: movieworld-config
              key: moviereview-service-url
  
        - name: DB_HOST
          value: "movieworld-mysql.movie.svc.cluster.local"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "movieworld"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: movieworld-mysql-secret
              key: mysql-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: movieworld-mysql-secret
              key: mysql-password
        
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9090
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9090
          initialDelaySeconds: 60
          periodSeconds: 15
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
      volumes:
      - name: config-volume
        configMap:
          name: movieworld-config

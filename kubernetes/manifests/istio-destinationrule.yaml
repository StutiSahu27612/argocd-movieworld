apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: movieworld
spec:
  host: movieworld
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 60s
  subsets:
  - name: v1
    labels:
      version: v1

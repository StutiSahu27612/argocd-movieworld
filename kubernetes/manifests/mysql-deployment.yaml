apiVersion: apps/v1
kind: Deployment
metadata:
  name: movieworld-mysql
  namespace: movie
  labels:
    app: movieworld-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movieworld-mysql
  template:
    metadata:
      labels:
        app: movieworld-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: movieworld-mysql-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: movieworld
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: movieworld-mysql-secret
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: movieworld-mysql-secret
              key: mysql-password
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        securityContext:
            runAsUser: 1000
            allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: movieworld-mysql-pvc







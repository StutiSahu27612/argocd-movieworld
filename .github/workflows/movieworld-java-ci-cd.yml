name: MovieWorld CI/CD Pipeline
  
on: 
  push:
    branches: ["feature-app"] 
  pull_request: 
    branches: ["feature-app"]
  
permissions:  
    id-token: write 
    contents: read  
    actions: write
    packages: write # Needed for Docker operation
  
jobs:
  CI:
   name: Build and Deploy to GCP
   runs-on: ubuntu-22.04

   env:  
      PROJECT_ID: 'project-stuti-477509' # TODO: update to your Google Cloud project ID
      REGION: 'us-central1' # TODO: update to your region
      SERVICE: 'argocd-poc-repo' # TODO: update to your service name
      IMAGE_NAME: 'movieworld-app-image'  # DOCKER Image Name   

      
  # Checkout code from the repository 
   steps:
   - name: Checkout Code
     uses: actions/checkout@v3

  # Set up JDK
   - name: Set up JDK 17
     uses: actions/setup-java@v3
     with:
       java-version: '17'
       distribution: 'temurin'
       cache: maven

# Scan repository for secrets using Trivy
   - name: Scan for secrets with Trivy
     uses: aquasecurity/trivy-action@master
     with:
      scan-type: 'fs'
      scan-ref: '.'
      format: 'table'
      output: 'trivy-secrets-results.txt'
      severity: 'CRITICAL,HIGH'
      scanners: 'secret'
      exit-code: '0'  # Fail pipeline on secrets

  # Upload Trivy secrets scan results
   - name: Upload Trivy secrets scan results
     uses: actions/upload-artifact@v4
     if: always()
     with:
      name: trivy-secrets-scan-results
      path: trivy-secrets-results.txt
      retention-days: 7

    # Run unit tests and generate reports
   - name: Run Unit Tests
     run: mvn test

  # Generate JaCoCo coverage report
   - name: Generate JaCoCo Coverage Report
     run: mvn jacoco:report

  # Upload test results
   - name: Upload Test Results
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: test-results
      path: ./target/surefire-reports/
      retention-days: 7
      if-no-files-found: warn

  # Upload coverage report
   - name: Upload Coverage Report
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: coverage-report
      path: |
        ./target/site/jacoco/
        ./target/site/jacoco.xml
        ./target/jacoco.exec
      retention-days: 7
      if-no-files-found: warn

  # # SonarQube scan
  #  - name: Cache SonarQube packages
  #    uses: actions/cache@v4
  #    with:
  #     path: ~/.sonar/cache
  #     key: ${{ runner.os }}-sonar
  #     restore-keys: ${{ runner.os }}-sonar
  #  - name: Cache Maven packages
  #    uses: actions/cache@v4
  #    with:
  #     path: ~/.m2
  #     key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
  #     restore-keys: ${{ runner.os }}-m2
  #  - name: SonarQube Build and analyze
  #    env:
  #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
  #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #    run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

    # Run Build
   - name: Run Build
     run: mvn clean package

#***************************Adding code for Setting Up WIF 

   - name: Authenticate to Google Cloud
     id: auth
     uses: google-github-actions/auth@v2
     with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
 
      # Set up Cloud SDK
   - name: Set up Cloud SDK
     uses: google-github-actions/setup-gcloud@v2

   - name: List GCP storage
     run: |
      gcloud storage ls


     # Create Docker Image with Tag
   - name: Build & Tag Docker Image
     id: build_image
     run: |
        DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
         echo "::set-output name=DOCKER_TAG::${DOCKER_TAG}"  # Set the DOCKER_TAG as output
         docker build --tag ${DOCKER_TAG} .
        

    # List Images
   - name: List Images
     run: |
         docker images 

    # Scan Docker Image
   - name: Scan Docker Image
     uses: aquasecurity/trivy-action@0.20.0
     with:
         image-ref: ${{ steps.build_image.outputs.DOCKER_TAG }}  # Reference the IMAGE_TAG from the previous step
         scan-type: image
         scanners: vuln,secret
         ignore_unfixed: 'false'  # Whether to ignore unfixed vulnerabilities
         severity: 'HIGH,CRITICAL,MEDIUM,LOW'  # Minimum severity level to report (e.g., 'LOW', 'MEDIUM', 'HIGH', 'CRITICAL')
         exit-code: 0
         format: table

    # Push Docker Image to GCR
   - name: Push Docker Image to GCR
     run: |
         gcloud auth configure-docker us-central1-docker.pkg.dev
         docker push ${{ steps.build_image.outputs.DOCKER_TAG }}

  CD:
   name: Deploy to Kubernetes (GKE)
   needs: CI
   runs-on: ubuntu-latest

   steps:
     - name: Checkout Code
       uses: actions/checkout@v3

    # Authenticate to Google Cloud using Workload Identity or Service Account
     - id: auth
       name: Authenticate to GCP
       uses: google-github-actions/auth@v2
       with:
         workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
         service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

    # Set up gcloud and install kubectl
     - name: Set up Cloud SDK
       uses: google-github-actions/setup-gcloud@v2
       with:
        project_id: ${{ secrets.GKE_PROJECT_ID }}
        install_components: kubectl

    # Get GKE credentials so kubectl commands work
     - name: Get GKE credentials
       uses: google-github-actions/get-gke-credentials@v2
       with:
        cluster_name: ${{ secrets.GKE_CLUSTER_NAME }}
        location: ${{ secrets.GKE_CLUSTER_REGION }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    # Update deployment.yaml to use the new image from Artifact Registry
     - name: Update Deployment YAML with new image
       run: |
        IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}"
        echo "New image: $IMAGE"
        sed -i "s|image: .*|image: $IMAGE|" kubernetes/manifests/deployment.yaml

    # Apply namespace + cleanup only if needed
     - name: Ensure namespace exists
       run: |
         kubectl create namespace movie || true
         kubectl get ns movie
         kubectl apply -f kubernetes/manifests/mysql-sg-pvc.yaml -n movie --validate=false
         kubectl apply -f kubernetes/manifests/mysql-secret.yaml -n movie --validate=false
         kubectl apply -f kubernetes/manifests/mysql-service.yaml -n movie --validate=false
         kubectl apply -f kubernetes/manifests/mysql-deployment.yaml -n movie --validate=false

         echo "Waiting for MySQL to be ready..."
         sleep 45

         kubectl apply -f kubernetes/manifests/configmap.yaml -n movie --validate=false
         kubectl apply -f kubernetes/manifests/secret.yaml -n movie --validate=false
         kubectl apply -f kubernetes/manifests/deployment.yaml -n movie --validate=false
         kubectl apply -f kubernetes/manifests/service.yaml -n movie --validate=false

         kubectl get pods -n movie

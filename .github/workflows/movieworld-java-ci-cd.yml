name: MovieWorld CI/CD Pipeline
  
on: 
  push:
    branches: 
      - feature-app
  #     - main
  # pull_request: 
  #    branches:
  #      - feature-app
  #      - main
  
permissions:  
    id-token: write 
    actions: write
    packages: write # Needed for Docker operation
    contents: write
  
jobs:
  CI:
   name: Build and Deploy to GCP
   runs-on: ubuntu-22.04
   outputs:
      image_sha: ${{ steps.set-image-tag.outputs.image_sha }}

   env:  
      PROJECT_ID: 'project-stuti-477509' # TODO: update to your Google Cloud project ID
      REGION: 'us-central1' # TODO: update to your region
      SERVICE: 'argocd-poc-repo' # TODO: update to your service name
      IMAGE_NAME: 'movieworld-app-image'  # DOCKER Image Name   

      
  # Checkout code from the repository 
   steps:
   - name: Checkout Code
     uses: actions/checkout@v3

  # Set up JDK
   - name: Set up JDK 17
     uses: actions/setup-java@v3
     with:
       java-version: '17'
       distribution: 'temurin'
       cache: maven

# Scan repository for secrets using Trivy
   - name: Scan for secrets with Trivy
     uses: aquasecurity/trivy-action@master
     with:
      scan-type: 'fs'
      scan-ref: '.'
      format: 'table'
      output: 'trivy-secrets-results.txt'
      severity: 'CRITICAL,HIGH'
      scanners: 'secret'
      exit-code: '0'  # Fail pipeline on secrets

  # Upload Trivy secrets scan results
   - name: Upload Trivy secrets scan results
     uses: actions/upload-artifact@v4
     if: always()
     with:
      name: trivy-secrets-scan-results
      path: trivy-secrets-results.txt
      retention-days: 7

    # Run unit tests and generate reports
   - name: Run Unit Tests
     run: mvn test

  # Generate JaCoCo coverage report
   - name: Generate JaCoCo Coverage Report
     run: mvn jacoco:report

  # Upload test results
   - name: Upload Test Results
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: test-results
      path: ./target/surefire-reports/
      retention-days: 7
      if-no-files-found: warn

  # Upload coverage report
   - name: Upload Coverage Report
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: coverage-report
      path: |
        ./target/site/jacoco/
        ./target/site/jacoco.xml
        ./target/jacoco.exec
      retention-days: 7
      if-no-files-found: warn

  # # SonarQube scan
  #  - name: Cache SonarQube packages
  #    uses: actions/cache@v4
  #    with:
  #     path: ~/.sonar/cache
  #     key: ${{ runner.os }}-sonar
  #     restore-keys: ${{ runner.os }}-sonar
  #  - name: Cache Maven packages
  #    uses: actions/cache@v4
  #    with:
  #     path: ~/.m2
  #     key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
  #     restore-keys: ${{ runner.os }}-m2
  #  - name: SonarQube Build and analyze
  #    env:
  #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
  #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #    run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

    # Run Build
   - name: Run Build
     run: mvn clean package

#***************************Adding code for Setting Up WIF 

   - name: Authenticate to Google Cloud
     id: auth
     uses: google-github-actions/auth@v2
     with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
 
      # Set up Cloud SDK
   - name: Set up Cloud SDK
     uses: google-github-actions/setup-gcloud@v2

   - name: List GCP storage
     run: |
      gcloud storage ls


     # Create Docker Image with Tag
   - name: Build & Tag Docker Image
     id: build_image
     run: |
        DOCKER_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
         echo "::set-output name=DOCKER_TAG::${DOCKER_TAG}"  # Set the DOCKER_TAG as output
         docker build --tag ${DOCKER_TAG} .

        

    # List Images
   - name: List Images
     run: |
         docker images 
# Build job
   - name: Save image tag
     run: |
      echo "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" > image-tag.txt

   - name: Upload image tag artifact
     uses: actions/upload-artifact@v4
     with:
      name: image-tag
      path: image-tag.txt
    # Scan Docker Image
   - name: Scan Docker Image
     uses: aquasecurity/trivy-action@0.20.0
     with:
         image-ref: ${{ steps.build_image.outputs.DOCKER_TAG }}  # Reference the IMAGE_TAG from the previous step
         scan-type: image
         scanners: vuln,secret
         ignore_unfixed: 'false'  # Whether to ignore unfixed vulnerabilities
         severity: 'HIGH,CRITICAL,MEDIUM,LOW'  # Minimum severity level to report (e.g., 'LOW', 'MEDIUM', 'HIGH', 'CRITICAL')
         exit-code: 0
         format: table

    # Push Docker Image to GCR
   - name: Push Docker Image to GCR
     run: |
         gcloud auth configure-docker us-central1-docker.pkg.dev
         docker push ${{ steps.build_image.outputs.DOCKER_TAG }}

   - name: Set image tag for next workflow
     id: set-image-tag-for-next
     run: |
          echo "image_sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

   - name: Set image tag
     id: set-image-tag
     run: |
      SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
      REPO_NAME=$(basename "$GITHUB_REPOSITORY")
      IMAGE_TAG="${REPO_NAME}-${SHORT_SHA}"
      echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

   - name: Update deployment manifest
     run: |
       IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}"
       sed -i "s|image: .*|image: $IMAGE|" kubernetes/manifests/deployment.yaml
       cat kubernetes/manifests/deployment.yaml

   - name: Commit and push manifest
     run: |
       git config user.name "github-actions"
       git config user.email "github-actions@github.com"
       git add kubernetes/manifests/deployment.yaml
       git commit -m "Update movie deployment to $IMAGE_TAG"
       git push


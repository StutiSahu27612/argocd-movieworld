name: MovieWorld CI/CD Pipeline
 
on:
  push:
    branches: ["feature-app"]
    paths:
      - 'movieworld/**'
      - '.github/workflows/movieworld-ci-cd.yml'
  pull_request:
    branches: ["feature-app"]
    paths:
      - 'movieworld/**'
      - '.github/workflows/movieworld-ci-cd.yml'
permissions:
    id-token: write
    contents: read
    actions: write
 
 
jobs:
  CI:
   name: Build and Deploy to AWS
   runs-on: self-hosted
 
  # Checkout code from the repository
   steps:
   - name: Checkout Code
     uses: actions/checkout@v3

  # Set up JDK
   - name: Set up JDK 17
     uses: actions/setup-java@v3
     with:
       java-version: '17'
       distribution: 'temurin'
       cache: maven

# Scan repository for secrets using Trivy
   - name: Scan for secrets with Trivy
     uses: aquasecurity/trivy-action@master
     with:
      scan-type: 'fs'
      scan-ref: '.'
      format: 'table'
      output: 'trivy-secrets-results.txt'
      severity: 'CRITICAL,HIGH'
      scanners: 'secret'
      exit-code: '0'  # Fail pipeline on secrets

  # Upload Trivy secrets scan results
   - name: Upload Trivy secrets scan results
     uses: actions/upload-artifact@v4
     if: always()
     with:
      name: trivy-secrets-scan-results
      path: trivy-secrets-results.txt
      retention-days: 7

    # Run unit tests and generate reports
   - name: Run Unit Tests
     run: mvn -B test

  # Generate JaCoCo coverage report
   - name: Generate JaCoCo Coverage Report
     run: mvn -B jacoco:report

  # Upload test results
   - name: Upload Test Results
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: test-results
      path: /target/surefire-reports/
      retention-days: 7
      if-no-files-found: warn

  # Upload coverage report
   - name: Upload Coverage Report
     if: always()
     uses: actions/upload-artifact@v4
     with:
      name: coverage-report
      path: |
        /target/site/jacoco/
        /target/site/jacoco.xml
        /target/jacoco.exec
      retention-days: 7
      if-no-files-found: warn

    # Run Build
   - name: Run Build
     run: mvn -B clean install


  # # Build trust between GitHub and AWS using OIDC connector
  #  - name: configure aws credentials
  #    uses: aws-actions/configure-aws-credentials@v3
  #    with:
  #       role-to-assume: ${{ secrets.AWS_IAM_ARN }}
  #       role-session-name: java-app-session 
  #       aws-region: ${{ secrets.AWS_REGION }}
 

 
  # Authenticate AWS with Docker to interact with an Amazon ECR registry
   - name: Login to Amazon ECR
     run: aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID}}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
 
      
 
    # Build the Docker image using Dockerfile & tag it with commit SHA, & push it to ECR repository
   - name: Build Docker Image
     run: |
      cd movieworld
      docker build -t ${{ secrets.MOVIEWORLD_IMAGE_NAME }}:${{ github.sha }} .
      docker tag ${{ secrets.MOVIEWORLD_IMAGE_NAME }}:${{ github.sha }} ${{ secrets.AWS_ACCOUNT_ID}}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO_NAME_MOVIEWORLD }}:${{ github.sha }}

 

 
# Push Docker image to Amazon ECR
   - name: push docker image
     run: |
        docker push ${{ secrets.AWS_ACCOUNT_ID}}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPO_NAME_MOVIEWORLD }}:${{ github.sha }}
 

 
 
# Update Deployment YAML with the new image and Deploy ECR image to EKS 
   - name: Update Deployment YAML with New Image
     run: |
      aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
      IMAGE="${{ secrets.MOVIEWORLD_IMAGE_NAME }}:${{ github.sha }}"
      sed -i "s|image: .*|image: $IMAGE|" movieworld/kubernetes/manifests/deployment.yaml
      cd movieworld
      kubectl apply -f kubernetes/manifests/mysql-secret.yaml --validate=false
      kubectl apply -f kubernetes/manifests/mysql-pv-pvc.yaml --validate=false
      kubectl apply -f kubernetes/manifests/mysql-service.yaml --validate=false
      kubectl apply -f kubernetes/manifests/mysql-deployment.yaml --validate=false
      kubectl apply -f kubernetes/manifests/configmap.yaml --validate=false
      kubectl apply -f kubernetes/manifests/secret.yaml --validate=false
      kubectl apply -f kubernetes/manifests/deployment.yaml --validate=false
      kubectl apply -f kubernetes/manifests/service.yaml --validate=false
     




